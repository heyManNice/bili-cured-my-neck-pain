name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate version and prepare release notes
        id: release_info
        run: bun tools/prepare-release.ts "${GITHUB_REF_NAME}" "${GITHUB_OUTPUT}"

      - name: Run tests
        run: bun test

      - name: Build and package release assets
        run: |
          bun run build
          bun run build:tm
          bun run package:release -- "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_info.outputs.version }}
          RELEASE_TITLE: ${{ steps.release_info.outputs.release_title }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --fail-on-no-commits \
            --title "${RELEASE_TITLE}" \
            --notes-file release/release-notes.md \
            "release/bcmnp_v${VERSION}.zip#Chrome / Edge / Firefox extension" \
            "release/bcmnp_v${VERSION}.tampermonkey.user.js#Tampermonkey userscript"
